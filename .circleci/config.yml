version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:22.0.0
    steps:
      - checkout
      - run:
          name: Run build
          command: npm run compile

  test:
    docker:
      - image: cimg/node:22.0.0
    steps:
      - checkout
      - run:
          name: Test the app
          command: npm test

  publish:
    docker:
      - image: cimg/node:22.0.0
    steps:
      - checkout
      - run:
          name: Compile before publish
          command: npm run compile
      - run:
          name: Publish to NPM
          command: npm publish --access public

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          requires:
            - test
          filters:
            branches:
              only: master
