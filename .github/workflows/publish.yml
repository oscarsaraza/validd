name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish package with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Run build
        run: node scripts/build.js

      - name: Run tests
        run: node --test

      - name: Inspect OIDC Token Exchange
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is not set."
            exit 1
          fi
          echo "Requesting GitHub OIDC ID token with audience 'npm:registry.npmjs.org'..."
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          echo "GitHub ID token obtained (characters: ${#TOKEN})."
          echo "Testing exchange with npm registry for package 'validd'..."
          EXCHANGE_RES=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/validd")
          echo "$EXCHANGE_RES"

      - name: Publish to NPM
        run: npm publish --provenance --access public --verbose
